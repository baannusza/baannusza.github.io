<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>วัดเขาคันทรง เว็บธรรมะ</title>
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png" />

	<link rel="stylesheet" href="Videoplaylist.css">
<style>* {
	font-family: "prompt";
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	text-transform: capitalize;
}
body {
	background-color: #ffffff;
	padding: 20px;
}
.container {
	max-width: 1200px;
	margin: auto;
	display: flex;
	flex-wrap: wrap;
	align-items: flex-start;
	gap: 20px;
}
.main-video-container {
	flex: 1 1 700px;
	background-color: #fff;
	padding: 15px;
}
.main-video {
	margin-bottom: 7px;
	width: 100%;
}
.main-vid-title {
	font-size: 20px;
	color: #444;
}
.video-list-container {
	flex: 1 1 300px;
	border-left: 2px solid #eee;
	background-color: #fff;
	padding: 15px 15px 15px 35px;
}

.list {
	display: flex;
	align-items: center;
	gap: 15px;
	padding: 10px;
	border: 1px solid #eee;
	cursor: pointer;
	border-radius: 5px;
	margin-bottom: 10px;
}
.list:last-child {
	margin-bottom: 0;
}
.list.active {
	background-color: #ffcc00;
}
.container .video-list-container .list.active .list-title {
	color: #fff;
}
.list-video {
	width: 100px;
	border-radius: 5px;
}
.list-title {
	font-size: 17px;
	color: #444;
}

@media (max-width:1200px) {
	.container {
		margin: 0;
	}
	.video-list-container{
		border: none !important;
		padding: 15px !important;
	}
}
@media (max-width:450px) {
	.video-list-container{
		border: none !important;
		padding: 15px !important;
	}
	.main-vid-title {
		font-size: 15px;
		text-align: center;
	}
	.list {
		flex-flow: column;
		gap: 10px;
	}
	.list-video {
		width: 100%;
	}
	.list-title {
		font-size: 15px;
		text-align: center;
	}
}</style>


<style>
        @font-face {
            font-family: "prompt"; font-stretch: normal; font-style: normal; font-weight: 400;
            src: url('https://855tech-mobile.s3.ap-east-1.amazonaws.com/content/css/fonts/prompt/Prompt-Regular.eot?#iefix') format('embedded-opentype'),
                url('https://855tech-mobile.s3.ap-east-1.amazonaws.com/content/css/fonts/prompt/Prompt-Regular.woff2') format('woff2'),
                url('https://855tech-mobile.s3.ap-east-1.amazonaws.com/content/css/fonts/prompt/Prompt-Regular.woff') format('woff'),
                url('https://855tech-mobile.s3.ap-east-1.amazonaws.com/content/css/fonts/prompt/Prompt-Regular.ttf') format('truetype');
        }
        body {
            font-family: "prompt";
        }
    </style>

</head>
<body>
	<div class="container">
        <h1>วีดีโอ</h1>
        <h1>วัดเขาคันทรง</h2>
        <a class="nav-link" href="index.html"><button class="btn danger">หน้าหลัก<br>วัดเขาคันทรง</button></a>
        </div>
	<div class="container">
        <p>งานประเพณ๊ตามพุทธศาสนา กิจกรรมงานบุญต่างๆที่สาธุชนร่วมบุญกับทางวัด <font color="red">(กำลังทำการอัพเดท ย้ายที่อยู่ไฟล์)</fon></p></center>
        </div>


	<div class="container">
		<div class="main-video-container">
			<video src="videos/home-video1.mp4" loop controls class="main-video"></video>
			<h3 class="main-vid-title">พระอธิการนิตย์เทศน์สอนนาค</h3>
		</div>
		<div class="video-list-container" id="videosList"></div>
	</div>

<script>const videosList = [
{
	video: 'videos/home-video1.mp4',
	title: 'พระอธิการนิตย์เทศน์สอนนาค'
},
{
	video: 'videos/home-video2.mp4',
	title: 'ทอดกฐินวัดเขาคันทรง 2566'
},
{
	video: 'videos/home-video3.mp4',
	title: 'ทำบุญบริษัทVisteon Auto'
},
{
	video: 'videos/home-video4.mp4',
	title: 'ทอดกฐินวัดเขาคันทรง 2568'
},
{
	video: 'videos/home-video5.mp4',
	title: 'จุดปะทัดสร้างแท่นถวายท้าวเวสสุวรรณ'
},
{
	video: 'videos/home-video6.mp4',
	title: '01.พระอธิการนิตย์ บิณฑบาตรโปรดญาติโยม'
},
{
	video: 'videos/home-video7.mp4',
	title: '02.พระอธิการนิตย์ บิณฑบาตรโปรดญาติโยม'
},
{
	video: 'videos/home-video8.mp4',
	title: 'วัดพระ วัดเขาคันทรง 08 เมษายน 2567'
},
]

const categories = [...new Set(videosList.map((item) => { return item }))]
document.getElementById('videosList').innerHTML = categories.map((item) => {
	var { video, title } = item;
	return (
		`<div class="list active">
		<video src=${video} class="list-video"></video>
		<h3 class="list-title">${title}</h3>
		</div>`
		)
}).join('')

let videoList = document.querySelectorAll('.video-list-container .list');
videoList.forEach(remove => { remove.classList.remove('active') });
videoList.forEach(vid => {
	vid.onclick = () => {
		videoList.forEach(remove => { remove.classList.remove('active') });
		vid.classList.add('active');
		let src = vid.querySelector('.list-video').src;
		let title = vid.querySelector('.list-title').innerHTML;
		document.querySelector('.main-video-container .main-video').src = src;
		document.querySelector('.main-video-container .main-video').play();
		document.querySelector('.main-video-container .main-vid-title').innerHTML = title;
	};
});</script>
	<script src="Videoplaylist.js"></script>

</body>
</html>
